<text x="646" y="97" font-size="11" font-weight="normal" fill="#555" text-anchor="start">ESP32-S3, pantalla, batería,</text>
<text x="646" y="114" font-size="11" font-weight="normal" fill="#555" text-anchor="start">acelerómetro, botón, buzzer</text>
<line x1="460" y1="174" x2="250" y2="96" stroke="#c2185b" stroke-width="1.5"/>

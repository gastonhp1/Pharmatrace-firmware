[platformio]
default_envs = esp32s3

; PharmaBox v2: ESP32-S3 + TFT ILI9488 + sonda SHT4x/VEML7700 + LIS3DH + precinto de cinto.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Subida directa por WiFi a un gateway de la LAN, solo para pruebas de banco:
    ; -DBENCH_WIFI_UPLINK
; Si tu módulo es N8R8 (PSRAM octal), descomentar. Ocupa GPIO35-37.
; board_build.arduino.memory_type = qio_opi
lib_deps =
    ; BLE. El código usa la API de la serie 2.x.
    h2zero/NimBLE-Arduino @ ^2.1.0
    ; Pantalla ILI9488 y dibujo del QR. Sin esta librería el firmware compila igual y "muestra"
    ; todo por el puerto serie (src/display_serial.cpp).
    lovyan03/LovyanGFX @ ^1.1.16
; Los sensores (SHT4x, VEML7700, LIS3DH) se leen directo por I2C en src/sensors.cpp, sin librerías.

; Tests de la lógica en la PC (sin hardware): pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra

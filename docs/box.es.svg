<text x="244" y="201" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="end">Cable plano por debajo de la tapa</text>
<text x="244" y="217" font-size="11" font-weight="normal" fill="#555" text-anchor="end"></text>
<text x="500" y="520" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">La luz adentro delata la tapa abierta o un corte en la pared.</text>
<text x="500" y="540" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">Es evidencia, no una cerradura: lo que pase queda en una lectura firmada.</text>

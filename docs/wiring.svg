<text x="30" y="830" font-size="11" fill="#555">Orden fisico del DevKit V1 de 30 pines (USB abajo). La version de 38 pines tiene otro orden: verificar contra la serigrafia de tu placa.</text>
<text x="30" y="846" font-size="11" fill="#555">UART del GPS cruzado. El reed switch usa el pull-up interno (INPUT_PULLUP), sin resistencia externa.</text>

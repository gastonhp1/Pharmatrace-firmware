[platformio]
default_envs = esp32s3

; Nodo de la valija: ESP32-S3 (ver iot/hardware/BOM.md en Pharmatrace).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
; Si tu módulo es N8R8 (PSRAM octal), descomentar. Ocupa GPIO35-37.
; board_build.arduino.memory_type = qio_opi
lib_deps =
    ; Descomentar a medida que se implementan los drivers (ver TODO en src/main.cpp)
    ; adafruit/Adafruit BusIO
    ; adafruit/Adafruit TMP117
    ; sensirion/Sensirion I2C SHT4x
    ; adafruit/Adafruit VEML7700 Library
    ; adafruit/Adafruit LIS3DH
    ; sandeepmistry/ArduinoECCX08
    ; mikalhart/TinyGPSPlus
    ; h2zero/NimBLE-Arduino @ ^2.1.0   (BLE de apertura; el código usa la API 2.x)
    ; ricmoo/QRCode                    (QR para la pantalla)
    ; zinggjm/GxEPD2                   (e-paper; elegir según el panel)

; Tests del protocolo en la PC (sin hardware): pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra

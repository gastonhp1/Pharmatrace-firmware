<text x="766" y="363" font-size="11" font-weight="normal" fill="#555" text-anchor="start">abrirla o cortar el cinto abre el lazo</text>
<line x1="374" y1="310" x2="250" y2="330" stroke="#1d6fd8" stroke-width="1.5"/>
